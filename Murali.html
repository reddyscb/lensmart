/* ============ EVENTS ============ */
document.addEventListener("click",async function(ev){
  const t=ev.target.closest("[data-act]");
  if(!t) return;
  const a=t.getAttribute("data-act"), v=t.getAttribute("data-v"), id=t.getAttribute("data-id");
  if(a==="overlay"&&ev.target.closest("[data-stop]")) return;
  if(a==="overlay"||a==="close"){ closeModal(); return; }

  switch(a){
    case "nav": ST.nav=v; render(); break;
    case "filter": ST.filter=v; render(); break;
    case "opensort": openSortPicker(); break;
    case "osort": ST.orderSort=v; closeModal(); render(); break;
    case "pipe": ST.filter=(ST.filter===v?"all":v); render(); break;
    case "clearq": ST.query=""; render(); break;
    case "clearpq": ST.pQuery=""; render(); break;
    case "pdist": ST.pDist=v; render(); break;
    case "pfilter": ST.pFilter=v; render(); break;
    case "discview": ST.discView=v; render(); break;
    case "period": ST.period=v; render(); break;
    case "operiod": ST.orderPeriod=v; render(); break;
    case "repview": ST.repView=v; render(); break;
    case "sort": ST.sortBy=v; render(); break;
    case "excel": exportExcel(); break;
    case "backup": backup(); break;
    case "restore": document.getElementById("restoreFile").click(); break;
    case "importbonzerdealers": {
      const existingNames=new Set(ST.practices.map(p=>p.name.toLowerCase()));
      const fresh=BONZER_DEALER_SEED.filter(d=>!existingNames.has(d.name.toLowerCase()));
      if(!fresh.length){ showToast("All "+BONZER_DEALER_SEED.length+" dealers already exist — nothing to import","warn"); break; }
      if(!t.getAttribute("data-confirmed")){
        const skipped=BONZER_DEALER_SEED.length-fresh.length;
        openConfirm("Import "+fresh.length+" new dealer"+(fresh.length!==1?"s":"")+" from Bonzer"
          +(skipped?" ("+skipped+" already exist and will be skipped)":"")+"?","importbonzerdealers",null,null,false,"settings");
        break;
      }
      fresh.forEach(d=>ST.practices.push(Object.assign(emptyPractice(),d)));
      ST.practices.sort((a,b)=>a.name.localeCompare(b.name));
      PM=pMap();
      await persist(); closeModal(); render();
      showToast("Imported "+fresh.length+" dealer"+(fresh.length!==1?"s":""));
      break; }
    case "dorestore": {
      const d=PENDING_RESTORE; PENDING_RESTORE=null;
      if(!d)break;
      ST.orders=d.orders||[];
      ST.practices=(d.practices||[]).map(p=>Object.assign(emptyPractice(),p));
      ST.expenses=d.expenses||[];
      if(d.biz)ST.biz=Object.assign(emptyBiz(),d.biz);
      PM=pMap();
      await persist(); closeModal(); render();
      showToast("Restored successfully");
      break; }
    case "settings": openSettings(); break;
    case "fab": if(ST.nav==="money") openExpenseForm(); else openOrderForm(); break;

    case "bsetv": {
      const m=MODAL(); m.querySelectorAll("[data-bf]").forEach(el=>{ST.biz[el.getAttribute("data-bf")]=el.value;});
      ST.biz[t.getAttribute("data-k")]=v; openSettings(); break; }
    case "savebiz": {
      const m=MODAL(); m.querySelectorAll("[data-bf]").forEach(el=>{
        let val=el.value; if(el.getAttribute("data-bf")==="gstin") val=val.toUpperCase().trim();
        ST.biz[el.getAttribute("data-bf")]=val;});
      await persist(); closeModal(); render(); break; }

    case "stage": {
      if(v==="out"){ openDispatchPrompt(id,!!t.getAttribute("data-keep")); break; }
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      o.stage=v; o.deliveredAt = v==="delivered" ? (o.deliveredAt||new Date().toISOString()) : null;
      await persist(); render();
      if(t.getAttribute("data-keep")) openDetail(id);
      break; }
    case "dispatchmethod": {
      const el=document.getElementById("dispatchDetail");
      if(el&&DISPATCH_DRAFT) DISPATCH_DRAFT.detail=el.value;
      if(DISPATCH_DRAFT) DISPATCH_DRAFT.method=v;
      renderDispatchPrompt();
      break; }
    case "confirmdispatch": {
      if(!DISPATCH_DRAFT)break;
      const el=document.getElementById("dispatchDetail");
      const detail=(el?el.value:DISPATCH_DRAFT.detail||"").trim();
      const o=ST.orders.find(x=>x.id===DISPATCH_DRAFT.id); if(!o){DISPATCH_DRAFT=null;break;}
      o.stage="out"; o.dispatchMethod=DISPATCH_DRAFT.method; o.dispatchDetail=detail;
      const keep=DISPATCH_DRAFT.keep, oid=o.id; DISPATCH_DRAFT=null;
      await persist(); closeModal(); render();
      showToast("Marked as dispatched"+(detail?" · "+detail:""));
      if(keep) openDetail(oid);
      break; }
    case "paid": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      o.paid=!o.paid;
      o.paidAt=o.paid?new Date().toISOString():null;
      o.paidAmount=o.paid?orderReceivable(o):0;
      await persist(); render();
      showToast(o.paid?"Marked as paid":"Marked as unpaid");
      if(t.getAttribute("data-back")==="stmt") openStatement(t.getAttribute("data-v"));
      else if(t.getAttribute("data-keep")) openDetail(id);
      break; }
    case "openpayment": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      const due=orderOutstanding(o);
      const back=t.getAttribute("data-back"), backV=t.getAttribute("data-v");
      openModal(sheetHead("Record payment",orderPaidAmt(o)>0?money(orderPaidAmt(o))+" received already · "+money(due)+" left":undefined)
        +'<div class="field"><label class="lbl">Amount received now</label>'
        +'<input class="inp" id="payamt" type="number" inputmode="decimal" value="'+due.toFixed(2)+'" placeholder="0.00"></div>'
        +'<p class="hint">Defaults to the full amount due — change it if this is a partial payment. The remaining balance stays outstanding.</p>'
        +'<button class="btn-main" data-act="recordpayment" data-id="'+o.id+'"'
        +(back?' data-back="'+back+'"':'')+(backV?' data-v="'+esc(backV)+'"':'')+'>'+ic("check",18)+' Save payment</button>');
      break; }
    case "recordpayment": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      const el=document.getElementById("payamt");
      const amt=Math.max(0,Number(el?el.value:0)||0);
      if(amt<=0){ showToast("Enter an amount greater than zero","warn"); break; }
      const total=Math.min(orderReceivable(o),orderPaidAmt(o)+amt);
      o.paidAmount=total; o.paidAt=new Date().toISOString();
      o.paid=total>=orderReceivable(o)-0.005; // fully settled once the running total covers the invoice
      if(o.paid) o.paidAmount=orderReceivable(o);
      await persist(); closeModal(); render();
      showToast(o.paid?"Marked as fully paid":money(amt)+" recorded · "+money(orderOutstanding(o))+" still due");
      if(t.getAttribute("data-back")==="stmt") openStatement(t.getAttribute("data-v"));
      else openDetail(id);
      break; }
    case "settle": {
      const un=ST.orders.filter(o=>o.practice===v&&!o.paid&&orderOutstanding(o)>0);
      if(!un.length)break;
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Mark all "+un.length+" unpaid orders as paid?","settle",null,v,false,"stmt",null,v);
        break;
      }
      un.forEach(o=>{o.paid=true;o.paidAt=new Date().toISOString();o.paidAmount=orderReceivable(o);});
      await persist(); closeModal(); render(); openStatement(v);
      showToast("Account settled · "+un.length+" order"+(un.length!==1?"s":"")+" paid");
      break; }
    case "delorder": {
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Delete this order permanently? This cannot be undone — consider Cancel instead if you might need the record.","delorder",id,null,true,"detail",id);
        break;
      }
      ST.orders=ST.orders.filter(o=>o.id!==id); await persist(); closeModal(); render(); break; }
    case "cancelorder": {
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Cancel this order? It stays in your records and reports marked as cancelled, but drops out of the open pipeline.","cancelorder",id,null,true,"detail",id);
        break;
      }
      ST.orders=ST.orders.map(o=>o.id===id?Object.assign({},o,{cancelled:true,cancelledAt:new Date().toISOString()}):o);
      await persist(); closeModal(); render();
      showToast("Order cancelled","warn");
      break; }
    case "uncancel": {
      ST.orders=ST.orders.map(o=>o.id===id?Object.assign({},o,{cancelled:false,cancelledAt:null}):o);
      await persist(); openDetail(id); render();
      showToast("Order restored");
      break; }
    case "editorder": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      closeModal(); openOrderFormEdit(o); break; }
    case "delexp": {
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Delete this expense?","delexp",id,null,true);
        break;
      }
      ST.expenses=ST.expenses.filter(e=>e.id!==id); await persist(); closeModal(); render(); break; }

    case "detail": openDetail(id); break;
    case "stmt": openStatement(v); break;
    case "newpractice": openPracticeEditor(""); break;
    case "editpractice": openPracticeEditor(v); break;

    case "pickemail": {
      const inp=document.getElementById(t.getAttribute("data-target"));
      if(inp){ inp.value=t.getAttribute("data-full"); updateEmailSuggestions(inp); inp.focus(); }
      break; }

    case "razorpaycheck": {
      const kind=t.getAttribute("data-kind");
      const el=document.getElementById("gstin_"+kind);
      const v=el?el.value.toUpperCase().trim():"";
      if(!v){ showToast("Enter a GSTIN first","warn"); break; }
      try{ await navigator.clipboard.writeText(v); showToast("GSTIN copied — paste it into Razorpay's search box"); }
      catch(e){ showToast("Opening Razorpay — copy the GSTIN manually ("+v+")","warn"); }
      window.open("https://razorpay.com/gst-number-search/","_blank");
      break; }

    case "remind": {
      const p=ST.practices.find(x=>x.name===v);
      if(!p)break;
      const stats=custStats(p);
      const msg=reminderText(p,stats);
      const digits=waDigits(p.phone);
      if(digits){
        window.open("https://wa.me/"+digits+"?text="+encodeURIComponent(msg),"_blank");
      } else if(p.email){
        window.open("mailto:"+encodeURIComponent(p.email)+"?subject="+encodeURIComponent("Payment reminder")+"&body="+encodeURIComponent(msg),"_blank");
      } else {
        showToast("No usable phone or email on file for "+p.name,"warn");
      }
      break; }

    case "exportcontacts": {
      const rows=ST._practiceRows||[];
      if(!rows.length){ showToast("No dealers to export","warn"); break; }
      const lines=rows.map(p=>[p.name,p.phone||"",p.email||""].filter(Boolean).join(" — ")).join("\n");
      openModal(sheetHead("Export contacts","Matches whatever's currently filtered ("+rows.length+" dealers) — copy for a WhatsApp broadcast list, or download as CSV for Mailchimp/Excel.")
        +'<div class="field"><textarea id="exportbox" class="inp" rows="9" readonly style="font-family:ui-monospace,monospace;font-size:12px;resize:vertical">'+esc(lines)+'</textarea></div>'
        +'<button class="btn-main" data-act="copycontacts">'+ic("clip",16)+' Copy all as text</button>'
        +'<button class="btn-sec" data-act="downloadcontacts">'+ic("download",16)+' Download as CSV</button>');
      break; }

    case "copycontacts": {
      const box=document.getElementById("exportbox");
      if(!box)break;
      try{ await navigator.clipboard.writeText(box.value); showToast("Copied "+(ST._practiceRows||[]).length+" contacts"); }
      catch(e){ box.select(); showToast("Couldn't auto-copy — text is selected, copy manually","warn"); }
      break; }

    case "downloadcontacts": {
      const rows=ST._practiceRows||[];
      if(!rows.length){ showToast("No dealers to export","warn"); break; }
      const esc2=s=>'"'+String(s||"").replace(/"/g,'""')+'"';
      const csv="Name,Phone,Email,City,District,State\n"+rows.map(p=>
        [p.name,p.phone,p.email,p.city,p.district,p.state].map(esc2).join(",")).join("\n");
      downloadBlob(csv,"murali_contacts_"+new Date().toISOString().slice(0,10)+".csv","text/csv");
      showToast("Downloaded "+rows.length+" contacts");
      break; }

    case "psetv": {
      const m=MODAL(); m.querySelectorAll("[data-pf]").forEach(el=>{PE[el.getAttribute("data-pf")]=el.value;});
      PE[t.getAttribute("data-k")]=v; renderPracticeEditor(); break; }
    case "delpractice": {
      if(!t.getAttribute("data-confirmed")){
        const orderCount=ST.orders.filter(o=>o.practice===id).length;
        openConfirm("Delete "+id+"? "+(orderCount?("Their "+orderCount+" order"+(orderCount!==1?"s":"")+" will stay in your records but won't be linked to a dealer profile anymore. "):"")+"This cannot be undone.",
          "delpractice",id,null,true,"editpractice",null,id);
        break;
      }
      ST.practices=ST.practices.filter(p=>p.name!==id);
      PM=pMap();
      await persist(); closeModal(); render();
      showToast("Dealer deleted","warn");
      break; }
    case "savepractice": {
      const m=MODAL(); m.querySelectorAll("[data-pf]").forEach(el=>{
        let val=el.value; if(el.getAttribute("data-pf")==="gstin") val=val.toUpperCase().trim();
        PE[el.getAttribute("data-pf")]=val;});
      const name=PE.name.trim(); if(!name)break;
      if(/\s/.test(PE.email||"")){ showToast("Remove the space from the email address first","warn"); break; }
      const orig=PE.__orig;
      const rec=Object.assign({},PE); delete rec.__orig; rec.name=name;
      if(orig){
        ST.practices=ST.practices.map(p=>p.name===orig?rec:p);
        if(name!==orig) ST.orders.forEach(o=>{if(o.practice===orig)o.practice=name;});
      } else {
        if(ST.practices.some(p=>p.name.toLowerCase()===name.toLowerCase()))break;
        ST.practices.push(rec);
      }
      ST.practices.sort((a,b)=>a.name.localeCompare(b.name));
      await persist(); closeModal(); render(); break; }

    case "saveexp": {
      const amt=Number(document.getElementById("ex_amt").value);
      if(!(amt>0)){alert("Enter an amount.");break;}
      ST.expenses.unshift({id:uid(),date:document.getElementById("ex_date").value,
        category:document.getElementById("ex_cat").value,description:document.getElementById("ex_desc").value,
        amount:amt,notes:document.getElementById("ex_notes").value});
      await persist(); closeModal(); render(); break; }

    case "sec": grabForm(); FS.sec[v]=!FS.sec[v]; renderOrderForm(); break;
    case "setv": grabForm(); FS[t.getAttribute("data-k")]=v; if(t.getAttribute("data-k")==="discountType")syncPriceFromDiscount(); renderOrderForm(); break;
    case "gotoadddealer": closeModal(); ST.nav="practices"; render(); openPracticeEditor(""); break;
    case "wheel": openWheelPicker(t.getAttribute("data-eye"),t.getAttribute("data-ek")); break;
    case "wheeldone": if(WP) closeWheelPicker(true); break;
    case "wheeloverlay": if(ev.target.closest("[data-stop]")) break; if(WP) closeWheelPicker(false); break;
    case "wheelclear": {
      if(!WP) break;
      FS[WP.eye][WP.key]="";
      closeWheelPicker(false);
      break; }
    case "saveorder": {
      grabForm();
      const isEdit=!!FS.editId;
      const name=FS.practice;
      if(!name){alert("Select a dealer.");break;}
      if(!FS.brand.trim()){alert("Enter the master brand.");break;}
      if(!FS.brandOther&&(BRAND_NAMES[FS.brand]||[]).length>1&&!FS.brandName.trim()){alert("Pick a brand name.");break;}
      if(!FS.brandOther&&((ITEM_HIERARCHY[FS.brand]||{})[FS.brandName]||[]).length>1&&!FS.item.trim()){alert("Pick an item.");break;}
      if(FS.od.sph===""&&FS.os.sph===""){alert("Enter at least one sphere value.");break;}
      if(!FS.promised){alert("Pick a promised delivery date before saving.");break;}
      { const rxViol=rxRangeViolations(FS); if(rxViol.length){alert(rxViol.join("\n"));break;} }
      const orderNo=isEdit?FS.orderNo:genOrderNo(name,new Date());
      const fields={
        orderNo:orderNo,
        type:FS.type,patientRef:FS.patientRef,customerMobile:FS.customerMobile,
        brand:FS.brand.trim(),brandName:(FS.brandName||"").trim(),item:(FS.item||"").trim(),itemId:FS.itemId||"",
        od:FS.od,os:FS.os,
        thickness:FS.thickness,uncoat:FS.uncoat,dimensions:FS.dimensions,fittingHeight:FS.fittingHeight,
        frameType:FS.frameType,diameter:FS.diameter,ed:FS.ed,
        qty:FS.qty,price:FS.price,cost:FS.cost,gstRate:FS.gstRate,hsn:FS.hsn,
        bonzerPrice:ITEM_DETAILS[FS.itemId]?ITEM_DETAILS[FS.itemId][0]:undefined,
        discountType:FS.discountType,discountValue:FS.discountValue,discountCode:(FS.discountCode||"").trim(),
        priority:FS.priority,promised:FS.promised,notes:FS.notes};
      if(isEdit){
        ST.orders=ST.orders.map(o=>{
          if(o.id!==FS.editId) return o;
          const wasPaid=o.paid, nowPaid=!!FS.paid;
          return Object.assign({},o,fields,{
            paid:nowPaid,
            paidAt: nowPaid ? (wasPaid?o.paidAt:new Date().toISOString()) : null
          });
        });
      } else {
        ST.orders.unshift(Object.assign({id:uid(),createdAt:new Date().toISOString(),practice:name,
          stage:"received",paid:!!FS.paid,paidAt:FS.paid?new Date().toISOString():null,deliveredAt:null},fields));
      }
      await persist(); closeModal(); ST.nav="orders"; render();
      showToast(isEdit?"Order updated":"Order booked");
      break; }
  }
});

// GSTIN validation: runs on every keystroke (see the "input" listener below) and again
// here on blur, in case a value was pasted in without triggering individual key events.
document.addEventListener("blur",function(ev){
  const el=ev.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="gstinguard"){
    const v=el.value.toUpperCase().trim();
    if(v!==el.value) el.value=v;
    applyGstinUI(el);
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="emailguard"){
    const box=document.getElementById(el.id+"_sugg");
    if(box){ box.classList.add("hide"); box.innerHTML=""; }
    emailSpaceCheck(el);
    if(el.id==="email_pf") refreshPracticeSaveBtn();
  }
},true);

// Tapping a domain-suggestion chip shouldn't blur the email input first (that would hide the
// chip row before the click/tap is registered) — keep focus on the input the whole time.
document.addEventListener("mousedown",function(ev){
  if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute("data-act")==="pickemail") ev.preventDefault();
});

document.addEventListener("input",function(ev){
  const el=ev.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="axisguard"){
    let v=el.value.replace(/[^0-9]/g,"").slice(0,3);
    if(v!==""&&Number(v)>180) v="180";
    if(v!==el.value) el.value=v;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="phoneguard"){
    const hadPlus = el.value.trim().startsWith("+");
    let digits = el.value.replace(/[^0-9]/g,"");
    if(digits.length>0 && digits.slice(0,2)==="91" && digits.length>10) digits=digits.slice(2); // drop leading 91 if it pushed past 10
    if(digits.length>10) digits=digits.slice(0,10);
    const v = hadPlus ? ("+91 "+digits) : digits;
    if(v!==el.value) el.value=v;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="gstinguard"){
    let v=el.value.toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,15);
    if(v!==el.value) el.value=v;
    applyGstinUI(el); // validates on every keystroke — flags a wrong character (e.g. a letter where a digit belongs) immediately
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="emailguard"){
    updateEmailSuggestions(el);
    emailSpaceCheck(el);
    if(el.id==="email_pf") refreshPracticeSaveBtn();
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="nameguard"){
    const name=el.value.trim();
    const dup=name&&name.toLowerCase()!==PE.__orig.toLowerCase()&&ST.practices.some(p=>p.name.toLowerCase()===name.toLowerCase());
    const errEl=document.getElementById("pf_name_err");
    if(errEl) errEl.classList.toggle("hide",!dup);
    refreshPracticeSaveBtn();
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="pinguard"){
    let v=el.value.replace(/[^0-9]/g,"").slice(0,6);
    if(v!==el.value) el.value=v;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="diaguard"&&FS){refreshOrderSaveBtn();}
  if(el.id==="q"||el.id==="pq"){
    if(el.id==="q")ST.query=el.value; else ST.pQuery=el.value;
    const sc=window.scrollY; render(); window.scrollTo(0,sc);
    const q=document.getElementById(el.id);
    if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length);}catch(e){}}
    return;
  }
  if(FS&&el.getAttribute&&el.getAttribute("data-act")==="calc"){
    grabForm();
    if(el.getAttribute("data-f")!=="price"){
      syncPriceFromDiscount();
      const priceEl=document.querySelector('[data-f="price"]');
      if(priceEl&&document.activeElement!==priceEl) priceEl.value=FS.price;
    }
    const tx=oTaxable(FS),gst=oGst(FS),cost=orderCost(FS),disc=oDiscount(FS);
    const mp=document.getElementById("mprev"); if(mp)mp.innerHTML=marginPreview(tx,gst,tx+gst,tx-cost,disc);
  }
});
document.addEventListener("change",function(ev){
  const el=ev.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="distsel"&&FS){grabForm();FS.dist=el.value;FS.practice="";renderOrderForm();return;}
  if(el.getAttribute&&el.getAttribute("data-act")==="brandsel"&&FS){
    grabForm();
    if(el.value==="__other__"){ FS.brandOther=true; FS.brand=""; }
    else { FS.brandOther=false; FS.brand=el.value; }
    const opts=BRAND_NAMES[FS.brand]||[];
    FS.brandName=opts.length===1?opts[0]:""; // auto-pick when there's only one real option (e.g. SL → NL)
    const items0=(ITEM_HIERARCHY[FS.brand]||{})[FS.brandName]||[];
    FS.itemId=items0.length===1?items0[0][0]:""; FS.item=items0.length===1?items0[0][1]:"";
    syncPriceFromDiscount();
    renderOrderForm(); return;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="brandnamesel"&&FS){
    grabForm();
    FS.brandName=el.value;
    const items=(ITEM_HIERARCHY[FS.brand]||{})[FS.brandName]||[];
    FS.itemId=items.length===1?items[0][0]:""; FS.item=items.length===1?items[0][1]:""; // auto-pick single-item catalogues
    syncPriceFromDiscount();
    renderOrderForm(); return;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="itemsel"&&FS){
    grabForm();
    const items=(ITEM_HIERARCHY[FS.brand]||{})[FS.brandName]||[];
    const found=items.find(it=>it[0]===el.value);
    FS.itemId=found?found[0]:""; FS.item=found?found[1]:"";
    syncPriceFromDiscount();
    renderOrderForm(); return;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="rerender"&&FS){grabForm();renderOrderForm();return;}
  if(el.getAttribute&&el.getAttribute("data-act")==="prerender"&&PE){
    MODAL().querySelectorAll("[data-pf]").forEach(x=>{PE[x.getAttribute("data-pf")]=x.value;});
    renderPracticeEditor(); return;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="promisedguard"&&FS){refreshOrderSaveBtn();return;}
  if(el.getAttribute&&el.getAttribute("data-act")==="gstratesel"&&FS){
    grabForm();
    FS.hsn=hsnForRate(FS.gstRate); // HSN follows the rate, per the table in Settings
    renderOrderForm();
    return;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="calc"&&FS){
    grabForm();
    if(el.getAttribute("data-f")!=="price"){
      syncPriceFromDiscount();
      const priceEl=document.querySelector('[data-f="price"]');
      if(priceEl&&document.activeElement!==priceEl) priceEl.value=FS.price;
    }
    const tx=oTaxable(FS),gst=oGst(FS),cost=orderCost(FS),disc=oDiscount(FS);
    const mp=document.getElementById("mprev"); if(mp)mp.innerHTML=marginPreview(tx,gst,tx+gst,tx-cost,disc);
    return;
  }
  if(el.id==="restoreFile"&&el.files&&el.files[0]){restore(el.files[0]);el.value="";}
});

/* ============ INIT ============ */
(async function(){
  ST.storeMode=await Store.init();
  const d=await Store.load();
  if(d){
    ST.orders=d.orders||[];
    ST.practices=(d.practices||[]).map(p=>{
      if(typeof p==="string") return Object.assign(emptyPractice(),{name:p});
      const q=Object.assign(emptyPractice(),p);
      if(!q.city&&p.town)q.city=p.town;          // migrate old UK field names
      if(!q.pin&&p.postcode)q.pin=p.postcode;
      return q;});
    ST.expenses=d.expenses||[];
    ST.biz=Object.assign(emptyBiz(),d.biz||{});
  }
  // One-time legacy-data seed: merges in the Bonzer dealer list on the very first load after
  // this update, then never again (gated by the persisted bonzerSeeded flag, not by whether the
  // list is empty) — so deleting an imported dealer later won't bring it back on a future reload.
  // Existing dealers are matched by name and skipped, so this is safe alongside any test/manual
  // data already in the app.
  if(!ST.biz.bonzerSeeded){
    const existingNames=new Set(ST.practices.map(p=>p.name.toLowerCase()));
    BONZER_DEALER_SEED.forEach(dl=>{
      if(existingNames.has(dl.name.toLowerCase()))return;
      ST.practices.push(Object.assign(emptyPractice(),dl));
      existingNames.add(dl.name.toLowerCase());
    });
    ST.practices.sort((a,b)=>a.name.localeCompare(b.name));
    ST.biz.bonzerSeeded=true;
    await persist();
  }
  // One-time backfill, separately gated from the seed above: dealers whose name contains "****"
  // are the ones enrolled in Bonzer's Partnership Program (per the source data's own
  // convention). Runs once against whatever's in ST.practices right now — covers dealers already
  // seeded before this feature existed — then never touches the field again, so if anyone
  // manually flips a dealer's enrollment later, a future reload won't silently overwrite it.
  if(!ST.biz.programMigrated){
    ST.practices.forEach(p=>{ if(p.name.includes("****")) p.bonzerProgram="yes"; });
    ST.biz.programMigrated=true;
    await persist();
  }
  PM=pMap();
  ST.ready=true;
  render();
})();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){

    // "Check for updates on every launch": ask the browser to re-fetch sw.js right away,
    // and again whenever the app is brought back to the foreground (covers reopening the
    // PWA from the home screen after it's been backgrounded for a while — the most common
    // way people actually relaunch it).
    reg.update().catch(function(){});
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="visible") reg.update().catch(function(){});
    });

    function showUpdateBanner(){
      if(document.getElementById("swupdate"))return; // already showing
      const b=document.createElement("div");
      b.id="swupdate";
      b.innerHTML='<span>'+ic("alert",15)+' Update available</span><button id="swupdate-btn">Tap to refresh</button>';
      document.body.appendChild(b);
      document.getElementById("swupdate-btn").onclick=function(){
        b.querySelector("button").textContent="Updating…";
        if(reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
      };
    }

    function trackInstalling(worker){
      worker.addEventListener("statechange",function(){
        // "installed" + an existing controller means this is an update to an already-running
        // app (not the very first install), which is exactly when we want the banner.
        if(worker.state==="installed"&&navigator.serviceWorker.controller) showUpdateBanner();
      });
    }
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdateBanner(); // an update was already waiting from a previous visit
    if(reg.installing) trackInstalling(reg.installing);
    reg.addEventListener("updatefound",function(){ trackInstalling(reg.installing); });

    // Once the new service worker takes over, do the actual refresh — this only fires after
    // the person taps the banner (which posts SKIP_WAITING), never on its own.
    let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(reloaded)return; reloaded=true;
      window.location.reload();
    });
  }).catch(function(){});
}
