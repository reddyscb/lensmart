      +'" style="flex:1;padding:11px 4px" data-act="setv" data-k="priority" data-v="'+x[0]+'">'+x[1]+'</button>').join("")+'</div></div></div>'
    +'<label class="paidtog"><input type="checkbox" data-f="paid"'+(f.paid?" checked":"")+'> '+(isEdit?"Paid":"Already paid")+'</label>'
    +'<div class="field"><label class="lbl">Notes</label>'
    +'<input class="inp" data-f="notes" value="'+esc(f.notes)+'" placeholder="Lab instructions, delivery notes…"></div>'
    +'<button class="btn-main'+(valid?"":" dis")+'" data-act="saveorder">'+ic("check",18)+' '+(isEdit?"Save changes":"Book order")+'</button>'
    +(valid?'':'<p class="hint">'+(!custOK?"Select or name a customer":!rxOK?"Enter at least one sphere value":!accOK?"Add a description":"Pick a promised delivery date")+'.</p>'), true);
}
function marginPreview(taxable,gst,inv,prof,discount){
  const c=prof>=0?"pos":"neg";
  return (discount>0?'<div style="grid-column:1/-1;font-size:11px;font-weight:700;color:#0369A1;text-align:center;margin-bottom:2px">'
    +ic("clip",10)+' Discount applied: -'+money(discount)+'</div>':'')
    +'<div><div class="mlbl">Taxable</div><div class="mval">'+money(taxable)+'</div></div>'
    +'<div><div class="mlbl">GST</div><div class="mval">'+money(gst)+'</div></div>'
    +'<div><div class="mlbl">Invoice</div><div class="mval">'+money(inv)+'</div></div>'
    +'<div><div class="mlbl">Margin</div><div class="mval '+c+'">'+(taxable?pct(prof,taxable).toFixed(0)+"%":"—")+'</div></div>';
}

/* ============ EXCEL EXPORT ============ */
function exportExcel(){
  if(!ST.orders.length&&!ST.expenses.length){alert("Nothing to export yet.");return;}
  const sheets=[];

  sheets.push({name:"Orders",rows:XL.objRows(ST.orders.map(o=>{const p=pOf(o.practice);
    const tx=oTaxable(o),g=oGst(o),inter=isInterState(o);
    return {
    "Job no":o.jobRef||"","Date":fmtDate(o.createdAt),"Customer":o.practice,"GSTIN":p.gstin||"",
    "City":p.city||"","District":p.district||"","State":p.state||"","Route":p.area||"","Patient ref":o.patientRef||"",
    "Order type":o.type==="rx"?"Rx lenses":o.type==="readers"?"Ready readers":"Frames / accessories",
    "Lens type":o.type==="rx"?(LENS_TYPES[o.lensType]||""):"",
    "PAL design":o.palDesign||"","Corridor":o.corridor||"","Seg type":o.segType||"",
    "OD SPH":dpt(o.od&&o.od.sph),"OD CYL":dpt(o.od&&o.od.cyl),"OD AXIS":axisFmt(o.od&&o.od.axis),"OD ADD":dpt(o.od&&o.od.add),
    "OD PRISM":(o.od&&o.od.prism)||"","OD BASE":(o.od&&o.od.base!=="—")?o.od.base:"",
    "OS SPH":dpt(o.os&&o.os.sph),"OS CYL":dpt(o.os&&o.os.cyl),"OS AXIS":axisFmt(o.os&&o.os.axis),"OS ADD":dpt(o.os&&o.os.add),
    "OS PRISM":(o.os&&o.os.prism)||"","OS BASE":(o.os&&o.os.base!=="—")?o.os.base:"",
    "PD bin":o.pdBin||"","PD OD":o.pdOD||"","PD OS":o.pdOS||"","Near PD":o.pdNear||"","Seg height":o.segHeight||"",
    "Material":matLabel(o.material),"Coatings":(o.coatings||[]).join(", "),
    "Photochromic":o.photo&&o.photo!=="None"?o.photo:"",
    "Tint":o.tintType&&o.tintType!=="None"?(o.tintType+" "+o.tintColor+" "+o.tintPct+"%"):"",
    "Frame type":o.frameType||"","Frame supply":o.frameSupply||"","Edging":o.edging||"","Blank dia":o.diameter||"",
    "Reader power":o.readerPower||"","Description":o.description||"",
    "HSN":o.hsn||"","Qty":oQty(o),"Rate excl GST":Number(o.price)||0,"Gross before discount":oGross(o),
    "Discount type":o.discountType&&o.discountType!=="none"?(o.discountType==="pct"?"Percentage":"Flat amount"):"",
    "Discount value":o.discountType&&o.discountType!=="none"?Number(o.discountValue)||0:"",
    "Discount amount":oDiscount(o),"Discount code":o.discountCode||"",
    "Taxable value":tx,"GST %":oRate(o),"CGST":inter?0:g/2,"SGST":inter?0:g/2,"IGST":inter?g:0,
    "Total GST":g,"Invoice total":tx+g,
    "Unit cost":Number(o.cost)||0,"Cost total":orderCost(o),"Profit":orderProfit(o),
    "Margin %":Number(pct(orderProfit(o),tx).toFixed(1)),
    "Supply":inter?"Inter-state":"Intra-state",
    "Priority":o.priority==="urgent"?"URGENT":"Standard","Promised":fmtDay(o.promised),
    "Stage":(STAGES[o.stage]||{}).label||o.stage,
    "Dispatch method":o.dispatchMethod?(DISPATCH_METHODS.find(m=>m[0]===o.dispatchMethod)||["",""])[1]:"",
    "Dispatch detail":o.dispatchDetail||"","Delivered":o.deliveredAt?fmtDay(o.deliveredAt):"",
    "Turnaround days":o.deliveredAt?daysBetween(o.createdAt,o.deliveredAt):"",
    "Cancelled":o.cancelled?"YES":"","Cancelled on":o.cancelledAt?fmtDate(o.cancelledAt):"",
    "Paid":o.paid?"PAID":orderPaidAmt(o)>0?"PARTIAL":"UNPAID","Paid on":o.paidAt?fmtDate(o.paidAt):"",
    "Amount paid":orderPaidAmt(o),"Outstanding":orderOutstanding(o),
    "Days outstanding":orderOutstanding(o)>0?daysAgo(o.createdAt):"",
    "Past terms":isPastTerms(o,p.terms)?"YES":"","Notes":o.notes||""};}))});

  sheets.push({name:"Customers",rows:XL.objRows(ST.practices.map(p=>{
    const co=ST.orders.filter(o=>o.practice===p.name&&!o.cancelled);
    const billed=co.reduce((s,o)=>s+orderReceivable(o),0);
    const tx=co.reduce((s,o)=>s+orderRevenue(o),0);
    const cost=co.reduce((s,o)=>s+orderCost(o),0);
    const paid=co.reduce((s,o)=>s+orderPaidAmt(o),0);
    return {"Customer":p.name,"GSTIN":p.gstin||"","Contact":p.contact||"","Mobile":p.phone||"","Email":p.email||"",
      "Address 1":p.addr1||"","Address 2":p.addr2||"","City":p.city||"","District":p.district||"",
      "State":p.state||"","PIN":p.pin||"","Delivery route":p.area||"","Terms (days)":p.terms||"",
      "Total orders":co.length,"Total billed":billed,"Taxable value":tx,"Total cost":cost,
      "Gross profit":tx-cost,"Margin %":Number(pct(tx-cost,tx).toFixed(1)),
      "Total paid":paid,"Outstanding":billed-paid,"Notes":p.notes||""};}))});

  const byCust={};
  ST.orders.filter(o=>!o.cancelled).forEach(o=>{const k=o.practice;byCust[k]=byCust[k]||{n:0,billed:0,tx:0,cost:0,paid:0,oldest:null};
    const c=byCust[k];c.n++;c.billed+=orderReceivable(o);c.tx+=orderRevenue(o);c.cost+=orderCost(o);
    c.paid+=orderPaidAmt(o);
    if(orderOutstanding(o)>0&&(!c.oldest||new Date(o.createdAt)<new Date(c.oldest)))c.oldest=o.createdAt;});
  sheets.push({name:"By customer",rows:XL.objRows(Object.keys(byCust).map(k=>{const c=byCust[k],p=pOf(k);
    return {Customer:k,City:p.city||"",District:p.district||"",State:p.state||"","Total orders":c.n,
      "Total billed":c.billed,"Taxable value":c.tx,"Total cost":c.cost,"Gross profit":c.tx-c.cost,
      "Margin %":Number(pct(c.tx-c.cost,c.tx).toFixed(1)),
      "Total paid":c.paid,"Outstanding":c.billed-c.paid,
      "Avg order value":Number((c.billed/c.n).toFixed(2)),
      "Oldest unpaid (days)":c.oldest?daysAgo(c.oldest):""};}).sort((a,b)=>b["Total billed"]-a["Total billed"]))});

  // Discounts — cancelled orders never happened, so excluded, matching every other financial sheet
  const discAll=ST.orders.filter(o=>!o.cancelled&&oDiscount(o)>0);
  const byCode={};
  discAll.forEach(o=>{const k=o.discountCode||"(no code)";
    byCode[k]=byCode[k]||{orders:0,amount:0,custs:new Set(),types:new Set()};
    const c=byCode[k];c.orders++;c.amount+=oDiscount(o);c.custs.add(o.practice);
    c.types.add(o.discountType==="pct"?"%":"Flat");});
  sheets.push({name:"Discounts by code",rows:XL.objRows(Object.keys(byCode).map(k=>{const c=byCode[k];
    return {"Code":k,"Type(s) used":[...c.types].join(", "),"Orders":c.orders,
      "Distinct customers":c.custs.size,"Total discount":Number(c.amount.toFixed(2))};})
    .sort((a,b)=>b["Total discount"]-a["Total discount"]))});

  const byCustType={};
  discAll.forEach(o=>{const type=o.discountType==="pct"?"Percentage":"Flat amount",k=o.practice+"|"+type;
    byCustType[k]=byCustType[k]||{customer:o.practice,type:type,orders:0,amount:0};
    const c=byCustType[k];c.orders++;c.amount+=oDiscount(o);});
  sheets.push({name:"Discounts by customer",rows:XL.objRows(Object.keys(byCustType).map(k=>{const c=byCustType[k];
    return {"Customer":c.customer,"Discount type":c.type,"Orders":c.orders,"Total discount":Number(c.amount.toFixed(2))};})
    .sort((a,b)=>b["Total discount"]-a["Total discount"]))});

  // GST summary by month x rate (cancelled orders never happened, so excluded from tax owed)
  const gs={};
  ST.orders.filter(o=>!o.cancelled).forEach(o=>{const key=monthKey(o.createdAt)+"|"+oRate(o);
    gs[key]=gs[key]||{m:monthKey(o.createdAt),r:oRate(o),n:0,tx:0,cgst:0,sgst:0,igst:0};
    const g=gs[key],t=oGst(o);g.n++;g.tx+=oTaxable(o);
    if(isInterState(o))g.igst+=t;else{g.cgst+=t/2;g.sgst+=t/2;}});
  sheets.push({name:"GST summary",rows:XL.objRows(Object.keys(gs).sort().map(k=>{const g=gs[k];
    return {Month:monthLabel(g.m),"GST %":g.r,Orders:g.n,"Taxable value":g.tx,
      CGST:g.cgst,SGST:g.sgst,IGST:g.igst,"Total tax":g.cgst+g.sgst+g.igst,
      "Invoice total":g.tx+g.cgst+g.sgst+g.igst};}))});

  sheets.push({name:"Expenses",rows:XL.objRows(ST.expenses.map(e=>({
    Date:fmtDay(e.date),Category:e.category,Description:e.description||"",Amount:Number(e.amount)||0,Notes:e.notes||""})))});

  const mm={};
  ST.orders.filter(o=>!o.cancelled).forEach(o=>{const k=monthKey(o.createdAt);mm[k]=mm[k]||{tx:0,gst:0,cost:0,exp:0,n:0,cash:0};
    mm[k].tx+=orderRevenue(o);mm[k].gst+=oGst(o);mm[k].cost+=orderCost(o);mm[k].n++;});
  ST.orders.filter(o=>o.paidAt&&!o.cancelled).forEach(o=>{const k=monthKey(o.paidAt);
    mm[k]=mm[k]||{tx:0,gst:0,cost:0,exp:0,n:0,cash:0};mm[k].cash+=orderPaidAmt(o);});
  ST.expenses.forEach(e=>{const k=monthKey(e.date);mm[k]=mm[k]||{tx:0,gst:0,cost:0,exp:0,n:0,cash:0};mm[k].exp+=Number(e.amount)||0;});
  sheets.push({name:"Monthly summary",rows:XL.objRows(Object.keys(mm).sort().map(k=>{const m=mm[k],gp=m.tx-m.cost;
    return {Month:monthLabel(k),Orders:m.n,"Revenue excl GST":m.tx,"GST charged":m.gst,
      "Billed incl GST":m.tx+m.gst,"Cash collected":m.cash,"Cost of goods":m.cost,"Gross profit":gp,
      "Margin %":Number(pct(gp,m.tx).toFixed(1)),Expenses:m.exp,"Net profit":gp-m.exp};}))});

  const grp=(fn,col,name)=>{const g={};
    ST.orders.filter(o=>!o.cancelled).forEach(o=>{const k=fn(o)||"—";g[k]=g[k]||{n:0,qty:0,tx:0,cost:0,owed:0};
      g[k].n++;g[k].qty+=oQty(o);g[k].tx+=orderRevenue(o);g[k].cost+=orderCost(o);
      g[k].owed+=orderOutstanding(o);});
    const rows=Object.keys(g).map(k=>{const x={};x[col]=k;x.Orders=g[k].n;x.Units=g[k].qty;
      x["Revenue excl GST"]=g[k].tx;x.Cost=g[k].cost;x["Gross profit"]=g[k].tx-g[k].cost;
      x["Margin %"]=Number(pct(g[k].tx-g[k].cost,g[k].tx).toFixed(1));x.Outstanding=g[k].owed;return x;})
      .sort((a,b)=>b["Revenue excl GST"]-a["Revenue excl GST"]);
    sheets.push({name:name,rows:XL.objRows(rows)});};
  grp(o=>typeLabelOf(o),"Lens / product type","By lens type");
  grp(o=>matLabel(o.material),"Material","By material");
  grp(o=>cityOf(o.practice),"City","By city");
  grp(o=>districtOf(o.practice),"District","By district");
  grp(o=>stateOf(o.practice),"State","By state");
  grp(o=>areaOf(o.practice),"Delivery route","By route");

  const del=ST.orders.filter(o=>o.deliveredAt&&!o.cancelled);
  const avgTat=del.length?del.reduce((s,o)=>s+daysBetween(o.createdAt,o.deliveredAt),0)/del.length:0;
  const overdue=ST.orders.filter(isPastPromised);
  const past=ST.orders.filter(o=>!o.cancelled&&isPastTerms(o,pOf(o.practice).terms));
  const cancelledOrders=ST.orders.filter(o=>o.cancelled);
  sheets.push({name:"Service",rows:XL.objRows([
    {Metric:"Orders delivered",Value:del.length},
    {Metric:"Average turnaround (days)",Value:Number(avgTat.toFixed(1))},
    {Metric:"Orders past promised date",Value:overdue.length},
    {Metric:"Value past promised date",Value:overdue.reduce((s,o)=>s+orderReceivable(o),0)},
    {Metric:"Bills past payment terms",Value:past.length},
    {Metric:"Value past payment terms",Value:past.reduce((s,o)=>s+orderOutstanding(o),0)},
    {Metric:"Urgent orders still open",Value:ST.orders.filter(o=>o.priority==="urgent"&&o.stage!=="delivered"&&!o.cancelled).length},
    {Metric:"Cancelled orders",Value:cancelledOrders.length},
    {Metric:"Cancelled orders value",Value:cancelledOrders.reduce((s,o)=>s+orderReceivable(o),0)}
  ].concat(STAGE_ORDER.map(k=>({Metric:"At stage: "+STAGES[k].label,Value:ST.orders.filter(o=>o.stage===k&&!o.cancelled).length}))))});

  downloadBlob(XL.build(sheets),"murali_report_"+new Date().toISOString().slice(0,10)+".xlsx",
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

function backup(){
  downloadBlob(JSON.stringify({app:"meridian",v:2,exported:new Date().toISOString(),
    orders:ST.orders,practices:ST.practices,expenses:ST.expenses,biz:ST.biz},null,2),

let PENDING_RESTORE=null;
function restore(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.orders)) throw new Error("bad file");
      PENDING_RESTORE=d;
      openConfirm("Restore "+d.orders.length+" orders, "+(d.practices||[]).length+" customers and "
        +(d.expenses||[]).length+" expenses? This REPLACES everything currently in the app.","dorestore",null,null,true,"settings");
    }catch(e){ alert("That file could not be read as a Murali backup."); }
  };
  r.readAsText(file);
}

/* ============ TOAST ============ */
let toastTimer=null, toastRemoveTimer=null;
function showToast(msg,tone){
  if(!document.body) return; // defensive: no-op if body isn't available yet
  let el=document.getElementById("toast");
  if(!el){
    el=document.createElement("div");
    el.id="toast";
    document.body.appendChild(el);
  }
  clearTimeout(toastTimer);
  clearTimeout(toastRemoveTimer);
  el.className="toast toast-"+(tone||"ok")+" toast-in";
  el.innerHTML=(tone==="warn"?ic("alert",16):ic("check",16))+'<span>'+esc(msg)+'</span>';
  // force reflow so re-triggering the animation on rapid consecutive actions restarts cleanly
  void el.offsetWidth;
  el.classList.add("toast-show");
  toastTimer=setTimeout(function(){
    el.classList.remove("toast-show");
    toastRemoveTimer=setTimeout(function(){
      const cur=document.getElementById("toast");
      // only remove if this is still the same element and no newer toast has reclaimed it
      if(cur===el && el.parentNode && !el.classList.contains("toast-show")) el.remove();
    },250);
  },1800);
}

/* ============ EVENTS ============ */
document.addEventListener("click",async function(ev){
  const t=ev.target.closest("[data-act]");
  if(!t) return;
  const a=t.getAttribute("data-act"), v=t.getAttribute("data-v"), id=t.getAttribute("data-id");
  if(a==="overlay"&&ev.target.closest("[data-stop]")) return;
  if(a==="overlay"||a==="close"){ closeModal(); return; }

  switch(a){
    case "nav": ST.nav=v; render(); break;
    case "filter": ST.filter=v; render(); break;
    case "opensort": openSortPicker(); break;
    case "osort": ST.orderSort=v; closeModal(); render(); break;
    case "pipe": ST.filter=(ST.filter===v?"all":v); render(); break;
    case "clearq": ST.query=""; render(); break;
    case "clearpq": ST.pQuery=""; render(); break;
    case "pdist": ST.pDist=v; render(); break;
    case "pfilter": ST.pFilter=v; render(); break;
    case "discview": ST.discView=v; render(); break;
    case "period": ST.period=v; render(); break;
    case "repview": ST.repView=v; render(); break;
    case "sort": ST.sortBy=v; render(); break;
    case "excel": exportExcel(); break;
    case "backup": backup(); break;
    case "restore": document.getElementById("restoreFile").click(); break;
    case "dorestore": {
      const d=PENDING_RESTORE; PENDING_RESTORE=null;
      if(!d)break;
      ST.orders=d.orders||[];
      ST.practices=(d.practices||[]).map(p=>Object.assign(emptyPractice(),p));
      ST.expenses=d.expenses||[];
      if(d.biz)ST.biz=Object.assign(emptyBiz(),d.biz);
      PM=pMap();
      await persist(); closeModal(); render();
      showToast("Restored successfully");
      break; }
    case "settings": openSettings(); break;
    case "fab": if(ST.nav==="money") openExpenseForm(); else openOrderForm(); break;

    case "bsetv": {
      const m=MODAL(); m.querySelectorAll("[data-bf]").forEach(el=>{ST.biz[el.getAttribute("data-bf")]=el.value;});
      ST.biz[t.getAttribute("data-k")]=v; openSettings(); break; }
    case "savebiz": {
      const m=MODAL(); m.querySelectorAll("[data-bf]").forEach(el=>{
        let val=el.value; if(el.getAttribute("data-bf")==="gstin") val=val.toUpperCase().trim();
        ST.biz[el.getAttribute("data-bf")]=val;});
      await persist(); closeModal(); render(); break; }

    case "stage": {
      if(v==="out"){ openDispatchPrompt(id,!!t.getAttribute("data-keep")); break; }
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      o.stage=v; o.deliveredAt = v==="delivered" ? (o.deliveredAt||new Date().toISOString()) : null;
      await persist(); render();
      if(t.getAttribute("data-keep")) openDetail(id);
      break; }
    case "dispatchmethod": {
      const el=document.getElementById("dispatchDetail");
      if(el&&DISPATCH_DRAFT) DISPATCH_DRAFT.detail=el.value;
      if(DISPATCH_DRAFT) DISPATCH_DRAFT.method=v;
      renderDispatchPrompt();
      break; }
    case "confirmdispatch": {
      if(!DISPATCH_DRAFT)break;
      const el=document.getElementById("dispatchDetail");
      const detail=(el?el.value:DISPATCH_DRAFT.detail||"").trim();
      const o=ST.orders.find(x=>x.id===DISPATCH_DRAFT.id); if(!o){DISPATCH_DRAFT=null;break;}
      o.stage="out"; o.dispatchMethod=DISPATCH_DRAFT.method; o.dispatchDetail=detail;
      const keep=DISPATCH_DRAFT.keep, oid=o.id; DISPATCH_DRAFT=null;
      await persist(); closeModal(); render();
      showToast("Marked as dispatched"+(detail?" · "+detail:""));
      if(keep) openDetail(oid);
      break; }
    case "paid": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      o.paid=!o.paid;
      o.paidAt=o.paid?new Date().toISOString():null;
      o.paidAmount=o.paid?orderReceivable(o):0;
      await persist(); render();
      showToast(o.paid?"Marked as paid":"Marked as unpaid");
      if(t.getAttribute("data-back")==="stmt") openStatement(t.getAttribute("data-v"));
      else if(t.getAttribute("data-keep")) openDetail(id);
      break; }
    case "openpayment": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      const due=orderOutstanding(o);
      const back=t.getAttribute("data-back"), backV=t.getAttribute("data-v");
      openModal(sheetHead("Record payment",orderPaidAmt(o)>0?money(orderPaidAmt(o))+" received already · "+money(due)+" left":undefined)
        +'<div class="field"><label class="lbl">Amount received now</label>'
        +'<input class="inp" id="payamt" type="number" inputmode="decimal" value="'+due.toFixed(2)+'" placeholder="0.00"></div>'
        +'<p class="hint">Defaults to the full amount due — change it if this is a partial payment. The remaining balance stays outstanding.</p>'
        +'<button class="btn-main" data-act="recordpayment" data-id="'+o.id+'"'
        +(back?' data-back="'+back+'"':'')+(backV?' data-v="'+esc(backV)+'"':'')+'>'+ic("check",18)+' Save payment</button>');
      break; }
    case "recordpayment": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      const el=document.getElementById("payamt");
      const amt=Math.max(0,Number(el?el.value:0)||0);
      if(amt<=0){ showToast("Enter an amount greater than zero","warn"); break; }
      const total=Math.min(orderReceivable(o),orderPaidAmt(o)+amt);
      o.paidAmount=total; o.paidAt=new Date().toISOString();
      o.paid=total>=orderReceivable(o)-0.005; // fully settled once the running total covers the invoice
      if(o.paid) o.paidAmount=orderReceivable(o);
      await persist(); closeModal(); render();
      showToast(o.paid?"Marked as fully paid":money(amt)+" recorded · "+money(orderOutstanding(o))+" still due");
      if(t.getAttribute("data-back")==="stmt") openStatement(t.getAttribute("data-v"));
      else openDetail(id);
      break; }
    case "settle": {
      const un=ST.orders.filter(o=>o.practice===v&&!o.paid&&orderOutstanding(o)>0);
      if(!un.length)break;
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Mark all "+un.length+" unpaid orders as paid?","settle",null,v,false,"stmt",null,v);
        break;
      }
      un.forEach(o=>{o.paid=true;o.paidAt=new Date().toISOString();o.paidAmount=orderReceivable(o);});
      await persist(); closeModal(); render(); openStatement(v);
      showToast("Account settled · "+un.length+" order"+(un.length!==1?"s":"")+" paid");
      break; }
    case "delorder": {
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Delete this order permanently? This cannot be undone — consider Cancel instead if you might need the record.","delorder",id,null,true,"detail",id);
        break;
      }
      ST.orders=ST.orders.filter(o=>o.id!==id); await persist(); closeModal(); render(); break; }
    case "cancelorder": {
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Cancel this order? It stays in your records and reports marked as cancelled, but drops out of the open pipeline.","cancelorder",id,null,true,"detail",id);
        break;
      }
      ST.orders=ST.orders.map(o=>o.id===id?Object.assign({},o,{cancelled:true,cancelledAt:new Date().toISOString()}):o);
      await persist(); closeModal(); render();
      showToast("Order cancelled","warn");
      break; }
    case "uncancel": {
      ST.orders=ST.orders.map(o=>o.id===id?Object.assign({},o,{cancelled:false,cancelledAt:null}):o);
      await persist(); openDetail(id); render();
      showToast("Order restored");
      break; }
    case "editorder": {
      const o=ST.orders.find(x=>x.id===id); if(!o)break;
      closeModal(); openOrderFormEdit(o); break; }
    case "delexp": {
      if(!t.getAttribute("data-confirmed")){
        openConfirm("Delete this expense?","delexp",id,null,true);
        break;
      }
      ST.expenses=ST.expenses.filter(e=>e.id!==id); await persist(); closeModal(); render(); break; }

    case "detail": openDetail(id); break;
    case "stmt": openStatement(v); break;
    case "newpractice": openPracticeEditor(""); break;
    case "editpractice": openPracticeEditor(v); break;

    case "pickemail": {
      const inp=document.getElementById(t.getAttribute("data-target"));
      if(inp){ inp.value=t.getAttribute("data-full"); updateEmailSuggestions(inp); inp.focus(); }
      break; }

    case "razorpaycheck": {
      const kind=t.getAttribute("data-kind");
      const el=document.getElementById("gstin_"+kind);
      const v=el?el.value.toUpperCase().trim():"";
      if(!v){ showToast("Enter a GSTIN first","warn"); break; }
      try{ await navigator.clipboard.writeText(v); showToast("GSTIN copied — paste it into Razorpay's search box"); }
      catch(e){ showToast("Opening Razorpay — copy the GSTIN manually ("+v+")","warn"); }
      window.open("https://razorpay.com/gst-number-search/","_blank");
      break; }

    case "remind": {
      const p=ST.practices.find(x=>x.name===v);
      if(!p)break;
      const stats=custStats(p);
      const msg=reminderText(p,stats);
      const digits=waDigits(p.phone);
      if(digits){
        window.open("https://wa.me/"+digits+"?text="+encodeURIComponent(msg),"_blank");
      } else if(p.email){
        window.open("mailto:"+encodeURIComponent(p.email)+"?subject="+encodeURIComponent("Payment reminder")+"&body="+encodeURIComponent(msg),"_blank");
      } else {
        showToast("No usable phone or email on file for "+p.name,"warn");
      }
      break; }

    case "exportcontacts": {
      const rows=ST._practiceRows||[];
      if(!rows.length){ showToast("No customers to export","warn"); break; }
      const lines=rows.map(p=>[p.name,p.phone||"",p.email||""].filter(Boolean).join(" — ")).join("\n");
      openModal(sheetHead("Export contacts","Matches whatever's currently filtered ("+rows.length+" customers) — copy for a WhatsApp broadcast list, or download as CSV for Mailchimp/Excel.")
        +'<div class="field"><textarea id="exportbox" class="inp" rows="9" readonly style="font-family:ui-monospace,monospace;font-size:12px;resize:vertical">'+esc(lines)+'</textarea></div>'
        +'<button class="btn-main" data-act="copycontacts">'+ic("clip",16)+' Copy all as text</button>'
        +'<button class="btn-sec" data-act="downloadcontacts">'+ic("download",16)+' Download as CSV</button>');
      break; }

    case "copycontacts": {
      const box=document.getElementById("exportbox");
      if(!box)break;
      try{ await navigator.clipboard.writeText(box.value); showToast("Copied "+(ST._practiceRows||[]).length+" contacts"); }
      catch(e){ box.select(); showToast("Couldn't auto-copy — text is selected, copy manually","warn"); }
      break; }

    case "downloadcontacts": {
      const rows=ST._practiceRows||[];
      if(!rows.length){ showToast("No customers to export","warn"); break; }
      const esc2=s=>'"'+String(s||"").replace(/"/g,'""')+'"';
      const csv="Name,Phone,Email,City,District,State\n"+rows.map(p=>
        [p.name,p.phone,p.email,p.city,p.district,p.state].map(esc2).join(",")).join("\n");
      downloadBlob(csv,"murali_contacts_"+new Date().toISOString().slice(0,10)+".csv","text/csv");
      showToast("Downloaded "+rows.length+" contacts");
      break; }

    case "psetv": {
      const m=MODAL(); m.querySelectorAll("[data-pf]").forEach(el=>{PE[el.getAttribute("data-pf")]=el.value;});
      PE[t.getAttribute("data-k")]=v; renderPracticeEditor(); break; }
    case "savepractice": {
      const m=MODAL(); m.querySelectorAll("[data-pf]").forEach(el=>{
        let val=el.value; if(el.getAttribute("data-pf")==="gstin") val=val.toUpperCase().trim();
        PE[el.getAttribute("data-pf")]=val;});
      const name=PE.name.trim(); if(!name)break;
      if(/\s/.test(PE.email||"")){ showToast("Remove the space from the email address first","warn"); break; }
      const orig=PE.__orig;
      const rec=Object.assign({},PE); delete rec.__orig; rec.name=name;
      if(orig){
        ST.practices=ST.practices.map(p=>p.name===orig?rec:p);
        if(name!==orig) ST.orders.forEach(o=>{if(o.practice===orig)o.practice=name;});
      } else {
        if(ST.practices.some(p=>p.name.toLowerCase()===name.toLowerCase()))break;
        ST.practices.push(rec);
      }
      ST.practices.sort((a,b)=>a.name.localeCompare(b.name));
      await persist(); closeModal(); render(); break; }

    case "saveexp": {
      const amt=Number(document.getElementById("ex_amt").value);
      if(!(amt>0)){alert("Enter an amount.");break;}
      ST.expenses.unshift({id:uid(),date:document.getElementById("ex_date").value,
        category:document.getElementById("ex_cat").value,description:document.getElementById("ex_desc").value,
        amount:amt,notes:document.getElementById("ex_notes").value});
      await persist(); closeModal(); render(); break; }

    case "mode": grabForm(); FS.mode=v; renderOrderForm(); break;
    case "otype": grabForm(); FS.type=v; FS.hsn=defaultHsn(v); renderOrderForm(); break;
    case "sec": grabForm(); FS.sec[v]=!FS.sec[v]; renderOrderForm(); break;
    case "setv": grabForm(); FS[t.getAttribute("data-k")]=v; renderOrderForm(); break;
    case "npsetv": grabForm(); FS.np[t.getAttribute("data-k")]=v; renderOrderForm(); break;
    case "coat": grabForm();
      FS.coatings=FS.coatings.includes(v)?FS.coatings.filter(x=>x!==v):FS.coatings.concat([v]);
      renderOrderForm(); break;
    case "wheel": openWheelPicker(t.getAttribute("data-eye"),t.getAttribute("data-ek")); break;
    case "wheeldone": if(WP) closeWheelPicker(true); break;
    case "wheeloverlay": if(ev.target.closest("[data-stop]")) break; if(WP) closeWheelPicker(false); break;
    case "wheelclear": {
      if(!WP) break;
      FS[WP.eye][WP.key]="";
      closeWheelPicker(false);
      break; }
    case "saveorder": {
      grabForm();
      const isEdit=!!FS.editId;
      const name=isEdit?FS.practice:(FS.mode==="existing"?FS.practice:FS.np.name.trim());
      if(!name){alert("Select or name a customer.");break;}
      if(FS.type==="rx"&&FS.od.sph===""&&FS.os.sph===""){alert("Enter at least one sphere value.");break;}
      if(!FS.promised){alert("Pick a promised delivery date before saving.");break;}
      if(!isEdit&&FS.mode==="new"){
        if(ST.practices.some(p=>p.name.toLowerCase()===name.toLowerCase())){alert("That customer already exists.");break;}
        if(/\s/.test(FS.np.email||"")){alert("Remove the space from the customer's email address first.");break;}
        const rec=Object.assign({},FS.np,{name:name,gstin:(FS.np.gstin||"").toUpperCase().trim()});
        ST.practices.push(rec); ST.practices.sort((a,b)=>a.name.localeCompare(b.name));
        PM=pMap();
      }
      const fields={
        type:FS.type,patientRef:FS.patientRef,jobRef:FS.jobRef,
        lensType:FS.lensType,palDesign:FS.palDesign,corridor:FS.corridor,segType:FS.segType,
        od:FS.od,os:FS.os,pdBin:FS.pdBin,pdOD:FS.pdOD,pdOS:FS.pdOS,pdNear:FS.pdNear,segHeight:FS.segHeight,
        material:FS.material,coatings:FS.coatings,photo:FS.photo,
        tintType:FS.tintType,tintColor:FS.tintColor,tintPct:FS.tintPct,
        frameType:FS.frameType,frameSupply:FS.frameSupply,edging:FS.edging,diameter:FS.diameter,
        readerPower:FS.readerPower,description:FS.description,
        qty:FS.qty,price:FS.price,cost:FS.cost,gstRate:FS.gstRate,hsn:FS.hsn,
        discountType:FS.discountType,discountValue:FS.discountValue,discountCode:(FS.discountCode||"").trim(),
        priority:FS.priority,promised:FS.promised,notes:FS.notes};
      if(isEdit){
        ST.orders=ST.orders.map(o=>{
          if(o.id!==FS.editId) return o;
          const wasPaid=o.paid, nowPaid=!!FS.paid;
          return Object.assign({},o,fields,{
            paid:nowPaid,
            paidAt: nowPaid ? (wasPaid?o.paidAt:new Date().toISOString()) : null
          });
        });
      } else {
        ST.orders.unshift(Object.assign({id:uid(),createdAt:new Date().toISOString(),practice:name,
          stage:"received",paid:!!FS.paid,paidAt:FS.paid?new Date().toISOString():null,deliveredAt:null},fields));
      }
      await persist(); closeModal(); ST.nav="orders"; render();
      showToast(isEdit?"Order updated":"Order booked");
      break; }
  }
});

// GSTIN validation: runs on every keystroke (see the "input" listener below) and again
// here on blur, in case a value was pasted in without triggering individual key events.
document.addEventListener("blur",function(ev){
  const el=ev.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="gstinguard"){
    const v=el.value.toUpperCase().trim();
    if(v!==el.value) el.value=v;
    applyGstinUI(el);
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="emailguard"){
    const box=document.getElementById(el.id+"_sugg");
    if(box){ box.classList.add("hide"); box.innerHTML=""; }
    emailSpaceCheck(el);
    if(el.id==="email_pf") refreshPracticeSaveBtn();
  }
},true);

// Tapping a domain-suggestion chip shouldn't blur the email input first (that would hide the
// chip row before the click/tap is registered) — keep focus on the input the whole time.
document.addEventListener("mousedown",function(ev){
  if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute("data-act")==="pickemail") ev.preventDefault();
});

document.addEventListener("input",function(ev){
  const el=ev.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="axisguard"){
    let v=el.value.replace(/[^0-9]/g,"").slice(0,3);
    if(v!==""&&Number(v)>180) v="180";
    if(v!==el.value) el.value=v;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="phoneguard"){
    const hadPlus = el.value.trim().startsWith("+");
    let digits = el.value.replace(/[^0-9]/g,"");
    if(digits.length>0 && digits.slice(0,2)==="91" && digits.length>10) digits=digits.slice(2); // drop leading 91 if it pushed past 10
    if(digits.length>10) digits=digits.slice(0,10);
    const v = hadPlus ? ("+91 "+digits) : digits;
    if(v!==el.value) el.value=v;
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="gstinguard"){
    let v=el.value.toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,15);
    if(v!==el.value) el.value=v;
    applyGstinUI(el); // validates on every keystroke — flags a wrong character (e.g. a letter where a digit belongs) immediately
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="emailguard"){
    updateEmailSuggestions(el);
    emailSpaceCheck(el);
    if(el.id==="email_pf") refreshPracticeSaveBtn();
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="nameguard"){
    const name=el.value.trim();
    const dup=name&&name.toLowerCase()!==PE.__orig.toLowerCase()&&ST.practices.some(p=>p.name.toLowerCase()===name.toLowerCase());
    const errEl=document.getElementById("pf_name_err");
    if(errEl) errEl.classList.toggle("hide",!dup);
    refreshPracticeSaveBtn();
  }
  if(el.getAttribute&&el.getAttribute("data-act")==="pinguard"){
    let v=el.value.replace(/[^0-9]/g,"").slice(0,6);
    if(v!==el.value) el.value=v;
  }
  if(el.id==="q"||el.id==="pq"){
    if(el.id==="q")ST.query=el.value; else ST.pQuery=el.value;
    const sc=window.scrollY; render(); window.scrollTo(0,sc);
    const q=document.getElementById(el.id);
    if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length);}catch(e){}}
    return;
  }
  if(FS&&el.getAttribute&&el.getAttribute("data-act")==="calc"){
    grabForm();
    const tx=oTaxable(FS),gst=oGst(FS),cost=orderCost(FS),disc=oDiscount(FS);
    const mp=document.getElementById("mprev"); if(mp)mp.innerHTML=marginPreview(tx,gst,tx+gst,tx-cost,disc);
  }
});
document.addEventListener("change",function(ev){
  const el=ev.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="distsel"&&FS){grabForm();FS.dist=el.value;FS.practice="";renderOrderForm();return;}
  if(el.getAttribute&&el.getAttribute("data-act")==="rerender"&&FS){grabForm();renderOrderForm();return;}
  if(el.getAttribute&&el.getAttribute("data-act")==="calc"&&FS){
    grabForm();
    const tx=oTaxable(FS),gst=oGst(FS),cost=orderCost(FS),disc=oDiscount(FS);
    const mp=document.getElementById("mprev"); if(mp)mp.innerHTML=marginPreview(tx,gst,tx+gst,tx-cost,disc);
    return;
  }
  if(el.id==="restoreFile"&&el.files&&el.files[0]){restore(el.files[0]);el.value="";}
});

/* ============ INIT ============ */
(async function(){
  ST.storeMode=await Store.init();
  const d=await Store.load();
  if(d){
    ST.orders=d.orders||[];
    ST.practices=(d.practices||[]).map(p=>{
      if(typeof p==="string") return Object.assign(emptyPractice(),{name:p});
      const q=Object.assign(emptyPractice(),p);
      if(!q.city&&p.town)q.city=p.town;          // migrate old UK field names
      if(!q.pin&&p.postcode)q.pin=p.postcode;
      return q;});
    ST.expenses=d.expenses||[];
    ST.biz=Object.assign(emptyBiz(),d.biz||{});
  }
  PM=pMap();
  ST.ready=true;
  render();
})();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){

    // "Check for updates on every launch": ask the browser to re-fetch sw.js right away,
    // and again whenever the app is brought back to the foreground (covers reopening the
    // PWA from the home screen after it's been backgrounded for a while — the most common
    // way people actually relaunch it).
    reg.update().catch(function(){});
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="visible") reg.update().catch(function(){});
    });

    function showUpdateBanner(){
      if(document.getElementById("swupdate"))return; // already showing
      const b=document.createElement("div");
      b.id="swupdate";
      b.innerHTML='<span>'+ic("alert",15)+' Update available</span><button id="swupdate-btn">Tap to refresh</button>';
      document.body.appendChild(b);
      document.getElementById("swupdate-btn").onclick=function(){
        b.querySelector("button").textContent="Updating…";
        if(reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
      };
    }

    function trackInstalling(worker){
      worker.addEventListener("statechange",function(){
        // "installed" + an existing controller means this is an update to an already-running
        // app (not the very first install), which is exactly when we want the banner.
        if(worker.state==="installed"&&navigator.serviceWorker.controller) showUpdateBanner();
      });
    }
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdateBanner(); // an update was already waiting from a previous visit
    if(reg.installing) trackInstalling(reg.installing);
    reg.addEventListener("updatefound",function(){ trackInstalling(reg.installing); });

    // Once the new service worker takes over, do the actual refresh — this only fires after
    // the person taps the banner (which posts SKIP_WAITING), never on its own.
    let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(reloaded)return; reloaded=true;
      window.location.reload();
    });
  }).catch(function(){});
}
